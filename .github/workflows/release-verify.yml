name: Release Verify
run-name: Verify ${{ inputs.release_ref }}

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Immutable release tag to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-verify-${{ inputs.release_ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Xcode 26.6 ReleaseVerify
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_REF: ${{ inputs.release_ref }}
    steps:
      - name: Validate immutable release ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_REF" =~ ^release-[A-Za-z0-9._-]+$ ]]; then
            echo "release_ref must be an immutable release-* tag" >&2
            exit 1
          fi

      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref }}
          persist-credentials: false

      - name: Prove tag and revision
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_REF"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_REF")"
          test -z "$(git status --porcelain)"
          git log -1 --format='Verified revision: %H'

      - name: Release automation tests
        shell: bash
        run: |
          set -euo pipefail
          ruby scripts/tests/forzadvisor_release_test.rb

      - name: Repository release preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Agents"
          ln -s "$GITHUB_WORKSPACE" "$HOME/Agents/ForzAdvisor"
          scripts/release preflight --ref "$RELEASE_REF"

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = "Xcode 26.6"

      - name: Run complete ReleaseVerify plan
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project forzadvisor.xcodeproj \
            -scheme forzadvisor \
            -testPlan ReleaseVerify \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -resultBundlePath "$RUNNER_TEMP/ForzAdvisor-ReleaseVerify.xcresult" \
            | tee "$RUNNER_TEMP/forzadvisor-release-verify.log"

      - name: Upload verification evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verify-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ForzAdvisor-ReleaseVerify.xcresult
            ${{ runner.temp }}/forzadvisor-release-verify.log
          if-no-files-found: warn
          retention-days: 14
